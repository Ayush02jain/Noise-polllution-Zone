name: Deploy SonicMap to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy geo JSON into frontend
        run: cp noise-pollution-dashboard/data/geo/all_cities_locations_geo.json noise-pollution-dashboard/frontend/all_cities_locations_geo.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "noise-pollution-dashboard/frontend"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
