<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Chennai Noise Pollution Zone Map Dashboard with ML-based classification (2020-2024)">
    <title>Chennai Noise Pollution Zone Map | 2020-2024</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chennai_style.css">
</head>
<body>

    <!-- Navbar -->
    <nav id="navbar">
        <div class="navbar-brand">
            <span class="navbar-icon">&#127983;</span>
            <h1>Chennai Noise Pollution Zone Map</h1>
        </div>
        <div class="navbar-meta">
            <span class="badge">2020 — 2024</span>
            <span class="badge badge-accent">10 Stations</span>
        </div>
    </nav>

    <!-- Main Layout -->
    <div id="app-container">

        <!-- Sidebar -->
        <aside id="sidebar">

            <!-- Year Filter -->
            <div class="filter-card">
                <h3 class="filter-title">Year Filter</h3>
                <select id="yearFilter">
                    <option value="all">All Years</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                </select>
            </div>

            <!-- Zone Type Filter -->
            <div class="filter-card">
                <h3 class="filter-title">Zone Type</h3>
                <div class="checkbox-group">
                    <label class="checkbox-label zone-commercial">
                        <input type="checkbox" id="zoneCommercial" value="Commercial" checked>
                        <span class="checkmark"></span>
                        Commercial
                    </label>
                    <label class="checkbox-label zone-industrial">
                        <input type="checkbox" id="zoneIndustrial" value="Industrial" checked>
                        <span class="checkmark"></span>
                        Industrial
                    </label>
                    <label class="checkbox-label zone-residential">
                        <input type="checkbox" id="zoneResidential" value="Residential" checked>
                        <span class="checkmark"></span>
                        Residential
                    </label>
                    <label class="checkbox-label zone-silence">
                        <input type="checkbox" id="zoneSilence" value="Silence" checked>
                        <span class="checkmark"></span>
                        Silence
                    </label>
                </div>
            </div>

            <!-- Zone Category Filter -->
            <div class="filter-card">
                <h3 class="filter-title">Zone Category</h3>
                <div class="checkbox-group">
                    <label class="checkbox-label cat-low">
                        <input type="checkbox" id="catLow" value="Low" checked>
                        <span class="checkmark"></span>
                        Low
                    </label>
                    <label class="checkbox-label cat-moderate">
                        <input type="checkbox" id="catModerate" value="Moderate" checked>
                        <span class="checkmark"></span>
                        Moderate
                    </label>
                    <label class="checkbox-label cat-high">
                        <input type="checkbox" id="catHigh" value="High" checked>
                        <span class="checkmark"></span>
                        High
                    </label>
                    <label class="checkbox-label cat-critical">
                        <input type="checkbox" id="catCritical" value="Critical" checked>
                        <span class="checkmark"></span>
                        Critical
                    </label>
                </div>
            </div>

            <!-- Reset -->
            <button id="resetFilters" class="btn-reset">Reset Filters</button>

            <!-- Statistics -->
            <div class="filter-card stats-card">
                <h3 class="filter-title">Statistics</h3>
                <div class="stat-row">
                    <span class="stat-label">Visible Stations</span>
                    <span class="stat-value" id="statTotal">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Avg Day dB</span>
                    <span class="stat-value" id="statDay">—</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Avg Night dB</span>
                    <span class="stat-value" id="statNight">—</span>
                </div>
            </div>

        </aside>

        <!-- Main Content -->
        <main id="main-content">
            <div id="map-wrapper">
                <div id="map"></div>

                <!-- Legend -->
                <div id="legend">
                    <h4>Noise Level</h4>
                    <div class="legend-item">
                        <span class="legend-swatch" id="swatch-low"></span>
                        <span>&lt; 55 dB (Low)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-swatch" id="swatch-moderate"></span>
                        <span>55–65 dB (Moderate)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-swatch" id="swatch-high"></span>
                        <span>65–72 dB (High)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-swatch" id="swatch-critical"></span>
                        <span>72–78 dB (Critical)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-swatch" id="swatch-severe"></span>
                        <span>&gt; 78 dB (Severe)</span>
                    </div>
                </div>
            </div>

            <!-- Trend Chart -->
            <div id="trend-panel">
                <h3 class="panel-title">Year-wise Noise Trend (2020–2024)</h3>
                <div id="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </main>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="chennai_script.js"></script>
</body>
</html>
